name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: my-notice-app-linux-x86_64
          - os: windows-latest
            artifact: my-notice-app-windows-x86_64
          - os: macos-latest
            artifact: my-notice-app-macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-shm0-dev \
            libxcb-icccm4-dev \
            libxcb-keysyms1-dev \
            libxcb-image0-dev \
            libxcb-cursor-dev \
            libxcb-composite0-dev \
            libxcb-xinerama0-dev \
            libxcb-randr0-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --release

      - name: Package artifacts
        shell: bash
        run: |
          set -e
          BIN="target/release/my-notice-app"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="$BIN.exe"
          fi
          mkdir -p dist
          cp "$BIN" "dist/${{ matrix.artifact }}"
          # 附带 SSE 测试服务端脚本
          cp scripts/sse_test_server.py dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
