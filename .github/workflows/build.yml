# my-notice-app 多平台构建与发布工作流
#
# 触发：
#   - push 到 main / PR：构建并上传构建产物（不发布）
#   - 打标签 v*（如 v0.1.0）：构建后自动创建 GitHub Release 并附带各平台二进制
#
# 平台：Windows x64 / macOS x64+arm64 / Linux x64

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: my-notice-app-x86_64-pc-windows-msvc
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: my-notice-app-x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: my-notice-app-aarch64-apple-darwin
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: my-notice-app-x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # GPUI 在 Linux 上需要的系统库（参考 gpui-component 官方 bootstrap 脚本，
      # 裁剪掉 webview 相关项；详见 https://github.com/longbridge/gpui-component）
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ clang pkg-config cmake \
            libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev \
            libvulkan1 vulkan-validationlayers

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      # 非 GUI 依赖先做单元测试（快速反馈）
      - name: Run unit tests (model & sse)
        run: cargo test -p notice-model -p notice-sse --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p notice-app --target ${{ matrix.target }}

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/my-notice-app"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="${BIN}.exe"; fi
          cp "$BIN" "dist/"
          cp README.md "dist/" 2>/dev/null || true
          cp LICENSE "dist/" 2>/dev/null || true
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  # 仅打标签时触发：合并各平台产物并发布 GitHub Release
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Inspect artifacts
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
