[workspace]
resolver = "2"
members = [
    "crates/notice-model",
    "crates/notice-sse",
    "crates/notice-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

# ---------------------------------------------------------------------------
# 依赖说明：全部来自 crates.io，无 git 依赖。
#
# - gpui 0.2.2 为 Zed GPUI 的官方 crates.io 发布版，内置 Windows / macOS /
#   Linux 平台后端（无需 gpui_platform 与平台后端 git 依赖）。
# - gpui-component 0.5.1 / gpui-component-assets 0.5.1 为对应 crates.io 发布版，
#   其依赖即 crates.io 的 gpui 0.2.2，三者版本配套。
# ---------------------------------------------------------------------------
[workspace.dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
