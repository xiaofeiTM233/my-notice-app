[package]
name = "notify-hub"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Lightweight Windows notification manager built with Rust + Slint"

[dependencies]
slint = { version = "1.17", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"

tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = "3"

tray-icon = "0.24"
open = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
