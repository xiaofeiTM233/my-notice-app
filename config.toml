# wnotify 配置文件
# 运行时自动加载 exe 同目录下的 config.toml，不存在则生成默认配置

[backend]
# ws   = WebSocket 实时推送
# poll = HTTP 长轮询
mode = "ws"
url = "ws://127.0.0.1:9000/ws"
# 鉴权 token（非空时以 Authorization: Bearer <token> 携带）
token = ""
# poll 模式轮询间隔（秒）
poll_secs = 5

[popup]
# 是否启用右下角弹窗
enabled = true
# 弹窗自动消失时长（秒）
secs = 6
# 弹窗排队上限
max_queue = 10

[filter]
# 允许的分类，空 = 全部。可选值: message / reminder / system
categories = []
# 最低优先级: low / normal / high（低于该级别被丢弃）
min_priority = "low"
# 标题或正文包含任一关键词即丢弃
block = []
# 仅显示包含任一关键词的通知（空 = 不过滤）
only = []

[ui]
# 启动时是否仅驻留托盘
start_minimized = false
